server {
    listen 80;
    listen 443 ssl;
    server_name bix.ovh
                www.bix.ovh;
    
    ssl_certificate     /var/www/magictintin/certs/bixc;
    ssl_certificate_key /var/www/magictintin/certs/bixk;

    root /var/www/magictintin/bix.ovh;

	index index.php;# index.html;

	location / {
	    index index.php;
	    try_files $uri $uri/ @php_fallback;
	}

	location @php_fallback {
        rewrite ^(.+)$ $1.php last;
    }

    include /var/www/magictintin/php.conf;
}

